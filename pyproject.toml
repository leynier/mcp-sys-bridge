[project]
name = "mcp-sys-bridge"
version = "0.2.0"
description = "An implementation of the Model Context Protocol (MCP), acting as a simple bridge to native OS functionalities like clipboard management, URL handling, and system notifications."
authors = [
    { name = "Leynier Gutiérrez González", email = "leynier41@gmail.com" },
]
readme = "readme.md"
license = "MIT"
license-files = ["license"]
keywords = [
    "python",
    "clipboard",
    "automation",
    "library",
    "cross-platform",
    "toolkit",
    "mcp",
    "utils",
    "protocol",
    "developer-tools",
    "system-integration",
    "system-bridge",
    "url-opener",
    "model-context-protocol",
    "mcp-server",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=3.4.6,<4",
    "mcp>=1.29.0,<2",
    "plyer>=2.1.0,<3",
    "pydantic>=2.13.4,<3",
    "pyperclip>=1.11.0,<2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.4.0,<10",
    "pytest-cov>=6.2.0,<8",
    "ruff>=0.16.2",
]

[project.scripts]
mcp-sys-bridge = "mcp_sys_bridge.server:main"

[project.urls]
homepage = "https://github.com/leynier/mcp-sys-bridge"
documentation = "https://github.com/leynier/mcp-sys-bridge"
repository = "https://github.com/leynier/mcp-sys-bridge"
issues = "https://github.com/leynier/mcp-sys-bridge/issues"
changelog = "https://github.com/leynier/mcp-sys-bridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sys_bridge"]

[tool.pytest.ini_options]
addopts = [
    "--cov=mcp_sys_bridge",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
